services:
  web:
    build: .
    image: tech-in-60:local
    command: ["npm", "start"]
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /app/media
      BROWSER_EXECUTABLE: /usr/bin/chromium
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - studio-data:/app/data
      - type: bind
        source: ${MEDIA_HOST_PATH:-./data/media}
        target: /app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: tech-in-60:local
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /app/media
      BROWSER_EXECUTABLE: /usr/bin/chromium
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - studio-data:/app/data
      - type: bind
        source: ${MEDIA_HOST_PATH:-./data/media}
        target: /app/media
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 10m
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/app/data/worker-heartbeat','utf8'))<180000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  studio-data:
